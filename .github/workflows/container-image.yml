name: Container Image
on:
  push:
    branches: [ss-container-image]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
env:
  CONTAINER_CMD: podman
  BUILDAH_FORMAT: oci
  IMG_URL: quay.io/samba.org/samba-metrics
jobs:
  build-images:
    strategy:
      matrix:
        package_source: [devbuilds, ceph20]
        os: [centos]
        arch:
          - {name: amd64, host: ubuntu-24.04}
          - {name: arm64, host: ubuntu-24.04-arm}
        include:
          - package_source: devbuilds
            os: centos
            arch: {name: amd64, host: ubuntu-24.04}
          - package_source: devbuilds
            os: centos
            arch: {name: arm64, host: ubuntu-24.04-arm}
          - package_source: ceph20
            os: centos
            arch: {name: amd64, host: ubuntu-24.04}
          - package_source: ceph20
            os: centos
            arch: {name: arm64, host: ubuntu-24.04-arm}
    runs-on: ${{ matrix.arch.host }}
    env:
      BASE_IMG_TAG: ${{ matrix.package_source }}-${{ matrix.os }}-${{ matrix.arch.name }}
      IMG_TAG: ${{ matrix.package_source }}-${{ matrix.os }}-${{ matrix.arch.name }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - name: Build image ${{ env.IMG_TAG }}
        run: >
          make CONTAINER_CMD=${{ env.CONTAINER_CMD }} \
            BASE_IMG_TAG=${{ env.BASE_IMG_TAG }} \
            IMG_URL=samba-metrics \
            IMG_TAG=${{ env.IMG_TAG }} \
            image-build
      - name: Save image ${{ env.IMG_TAG }}
        run: >
          ${{ env.CONTAINER_CMD }} save -o samba_metrics_${{ env.IMG_TAG }} \
            samba-metrics:${{ env.IMG_TAG }}
      - name: Upload image
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: action_image_artifact_samba_metrics_${{ env.IMG_TAG }}
          path: samba_metrics_${{ env.IMG_TAG }}
          retention-days: 1
  create-images:
    strategy:
      matrix:
        package_source: [devbuilds, ceph20]
        os: [centos]
    needs: build-images
    runs-on: ubuntu-latest
    env:
      IMG_TAG_PREFIX: ${{ matrix.package_source }}-${{ matrix.os }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - name: Download images
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: "action_image_artifact_samba_metrics_*"
          path: image_files
      - name: Load all images
        run: |
          for img in $(find image_files -type f) ; do
            ${{ env.CONTAINER_CMD }} image load -i "$img"
            rm -f "$img"
          done
      - name: List images (debug)
        run: ${{ env.CONTAINER_CMD }} images
      - name: Create multi-arch image
        run: >
          ${{ env.CONTAINER_CMD }} manifest create \
            samba-metrics:${{ env.IMG_TAG_PREFIX }}-any \
      - name: Add AMD64 image
        run: >
          ${{ env.CONTAINER_CMD }} manifest add \
            samba-metrics:${{ env.IMG_TAG_PREFIX }}-any --arch=amd64 \
            localhost/samba-metrics:${{ env.IMG_TAG_PREFIX }}-amd64
      - name: Add ARM64 image
        run: >
          ${{ env.CONTAINER_CMD }} manifest add \
            samba-metrics:${{ env.IMG_TAG_PREFIX }}-any --arch=arm64 \
            localhost/samba-metrics:${{ env.IMG_TAG_PREFIX }}-arm64
      - name: List images (debug)
        run: ${{ env.CONTAINER_CMD }} images
      - name: Inspect image
        run: >
          ${{ env.CONTAINER_CMD }} inspect \
            samba-metrics:${{ env.IMG_TAG_PREFIX }}-any
